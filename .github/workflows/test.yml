# LIV-43 — tests automatisés sur push/PR vers main.
# LIV-14 — le registre logiciel n'est PAS généré ici : voir
#   .github/workflows/release-register.yml (déclenché sur tags vX.Y.Z)
#   docs/quality/LIV-14_REGISTRE_LOGICIEL.md
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Run validation cases
        run: npm run test:cases
